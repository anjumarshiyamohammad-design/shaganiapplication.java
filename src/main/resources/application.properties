spring.application.name=shagani-shop
server.port=8080

# ---- Database (a file inside the "data" folder, so orders are kept after restart) ----
spring.datasource.url=jdbc:h2:file:./data/shagani
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# ---- Product photo uploads (saved in this folder next to the app) ----
shagani.upload-dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Shop details ----
shagani.whatsapp=918121842939
shagani.phone-display=8121842939
shagani.location=Ellanthakunta, Telangana
# Put your FSSAI number here when you get it (it appears in the footer). Leave empty until then.
shagani.fssai=

# ---- Owner login for /admin/orders (username: admin) ----
# Set a strong password with the ADMIN_PASSWORD environment variable before going live.
shagani.admin.password=${ADMIN_PASSWORD:change-me-now}
